<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント＆チケット管理ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [events, setEvents] = useState(() => {
        const saved = localStorage.getItem('event_tickets_data');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => {
        localStorage.setItem('event_tickets_data', JSON.stringify(events));
      }, [events]);

      const [newEvent, setNewEvent] = useState({
        title: '', startDate: '', endDate: '', location: '', eventUrl: '',
        tickets: [{ date: '', type: '', price: '', url: '', status: '応募前', memo: '' }]
      });

      const addTicket = () => {
        setNewEvent({
          ...newEvent,
          tickets: [...newEvent.tickets, { date: '', type: '', price: '', url: '', status: '応募前', memo: '' }]
        });
      };

      const handleTicketChange = (index, field, value) => {
        const updatedTickets = [...newEvent.tickets];
        updatedTickets[index][field] = value;
        setNewEvent({ ...newEvent, tickets: updatedTickets });
      };

      const saveEvent = () => {
        if (!newEvent.title) return alert('イベント名を入力してください');
        setEvents([{ ...newEvent, id: Date.now() }, ...events]);
        setNewEvent({
          title: '', startDate: '', endDate: '', location: '', eventUrl: '',
          tickets: [{ date: '', type: '', price: '', url: '', status: '応募前', memo: '' }]
        });
      };

      const deleteEvent = (id) => {
        if(window.confirm('このイベントを削除しますか？')) {
          setEvents(events.filter(e => e.id !== id));
        }
      };

      const updateTicketStatus = (eventId, ticketIndex, newStatus) => {
        const updatedEvents = events.map(event => {
          if (event.id === eventId) {
            const updatedTickets = [...event.tickets];
            updatedTickets[ticketIndex].status = newStatus;
            return { ...event, tickets: updatedTickets };
          }
          return event;
        });
        setEvents(updatedEvents);
      };

      const statusColors = {
        '応募前': 'bg-gray-200 text-gray-700',
        '抽選待ち': 'bg-yellow-100 text-yellow-800',
        '当選🎉': 'bg-red-100 text-red-800 font-bold',
        '落選': 'bg-gray-400 text-white',
        '行く日決定': 'bg-blue-100 text-blue-800',
        '行った🌟': 'bg-purple-100 text-purple-800'
      };

      return (
        <div className="min-h-screen p-4 md:p-8 font-sans text-sm md:text-base">
          <div className="max-w-6xl mx-auto space-y-6">
            
            <div className="bg-slate-800 text-white p-6 rounded-xl shadow-lg">
              <h1 className="text-2xl font-bold">🎫 イベント＆抽選管理ツール</h1>
            </div>

            {events.length > 0 && (
              <div className="flex gap-4 overflow-x-auto pb-4">
                {events.map(event => (
                  <a key={event.id} href={`#event-${event.id}`} className="flex-shrink-0 bg-white p-4 rounded-lg shadow-sm border border-gray-200 hover:shadow-md hover:-translate-y-1 transition-all w-64 block">
                    <h3 className="font-bold text-gray-800 truncate">{event.title}</h3>
                    <p className="text-xs text-gray-500 mt-1">📅 {event.startDate || '未定'} 〜 {event.endDate || '未定'}</p>
                  </a>
                ))}
              </div>
            )}

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              <div className="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <h2 className="text-xl font-bold mb-4 border-b pb-2">✏️ 新規イベント登録</h2>
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">イベント名</label>
                    <input type="text" className="w-full p-2 border rounded bg-gray-50" value={newEvent.title} onChange={e => setNewEvent({...newEvent, title: e.target.value})} placeholder="例: 〇〇展覧会" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">開始日</label>
                      <input type="date" className="w-full p-2 border rounded bg-gray-50" value={newEvent.startDate} onChange={e => setNewEvent({...newEvent, startDate: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-600 mb-1">終了日</label>
                      <input type="date" className="w-full p-2 border rounded bg-gray-50" value={newEvent.endDate} onChange={e => setNewEvent({...newEvent, endDate: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">会場</label>
                    <input type="text" className="w-full p-2 border rounded bg-gray-50" value={newEvent.location} onChange={e => setNewEvent({...newEvent, location: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">公式サイトURL</label>
                    <input type="url" className="w-full p-2 border rounded bg-gray-50" value={newEvent.eventUrl} onChange={e => setNewEvent({...newEvent, eventUrl: e.target.value})} />
                  </div>

                  <div className="pt-4 border-t">
                    <h3 className="text-sm font-bold text-gray-700 mb-3">🎫 チケット・応募情報</h3>
                    {newEvent.tickets.map((ticket, index) => (
                      <div key={index} className="p-3 bg-blue-50 rounded-lg mb-3 space-y-2 border border-blue-100">
                        <div className="grid grid-cols-2 gap-2">
                          <input type="date" className="p-2 border rounded text-sm" value={ticket.date} onChange={e => handleTicketChange(index, 'date', e.target.value)} />
                          <input type="text" placeholder="席種" className="p-2 border rounded text-sm" value={ticket.type} onChange={e => handleTicketChange(index, 'type', e.target.value)} />
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <input type="number" placeholder="金額" className="p-2 border rounded text-sm" value={ticket.price} onChange={e => handleTicketChange(index, 'price', e.target.value)} />
                          <input type="url" placeholder="申込URL" className="p-2 border rounded text-sm" value={ticket.url} onChange={e => handleTicketChange(index, 'url', e.target.value)} />
                        </div>
                        <input type="text" placeholder="メモ (同行者など)" className="w-full p-2 border rounded text-sm" value={ticket.memo} onChange={e => handleTicketChange(index, 'memo', e.target.value)} />
                      </div>
                    ))}
                    <button onClick={addTicket} className="text-blue-600 text-sm font-bold hover:underline mb-4">＋ 別の公演・チケットを追加</button>
                  </div>
                  <button onClick={saveEvent} className="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-slate-700">保存する</button>
                </div>
              </div>

              <div className="lg:col-span-2 space-y-6">
                {events.length === 0 ? (
                  <div className="bg-white p-10 rounded-xl text-center text-gray-400 border border-dashed">
                    まだ登録されたイベントはありません。
                  </div>
                ) : (
                  events.map((event) => (
                    <div key={event.id} id={`event-${event.id}`} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden scroll-mt-6">
                      <div className="bg-slate-50 p-4 border-b border-gray-200 flex justify-between items-start">
                        <div>
                          <h3 className="text-xl font-bold text-gray-800">{event.title}</h3>
                          <div className="text-sm text-gray-600 mt-2 flex flex-wrap gap-4">
                            <span>📅 {event.startDate || '未定'} 〜 {event.endDate || '未定'}</span>
                            {event.location && <span>📍 {event.location}</span>}
                          </div>
                          {event.eventUrl && <a href={event.eventUrl} target="_blank" className="inline-block mt-2 text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full hover:bg-gray-300">🔗 公式サイト</a>}
                        </div>
                        <button onClick={() => deleteEvent(event.id)} className="text-gray-400 hover:text-red-500 text-xl">🗑️</button>
                      </div>
                      <div className="p-4 space-y-3">
                        {event.tickets.map((ticket, tIndex) => (
                          <div key={tIndex} className={`p-4 rounded-lg border flex flex-col md:flex-row justify-between gap-3 ${ticket.status === '落選' ? 'bg-gray-50 opacity-60' : 'bg-white'}`}>
                            <div className="space-y-1">
                              <div className="font-bold text-gray-800 text-lg">{ticket.date ? `${ticket.date} 公演` : '日程未定'}</div>
                              <div className="text-sm text-gray-600 flex flex-wrap gap-3">
                                {ticket.type && <span>🎟️ {ticket.type}</span>}
                                {ticket.price && <span>¥{Number(ticket.price).toLocaleString()}</span>}
                                {ticket.url && <a href={ticket.url} target="_blank" className="text-blue-500 hover:underline">🔗 申込サイト</a>}
                              </div>
                              {ticket.memo && <div className="text-xs text-gray-500 mt-1">📝 {ticket.memo}</div>}
                            </div>
                            <div>
                              <select value={ticket.status} onChange={(e) => updateTicketStatus(event.id, tIndex, e.target.value)} className={`px-3 py-2 rounded-lg font-bold border-0 cursor-pointer ${statusColors[ticket.status]}`}>
                                <optgroup label="抽選ステータス"><option>応募前</option><option>抽選待ち</option><option>当選🎉</option><option>落選</option></optgroup>
                                <optgroup label="予定ステータス"><option>行く日決定</option><option>行った🌟</option></optgroup>
                              </select>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
